<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDF9F4">
<title>Moka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MOKA · design system v2
   Layout : mobile d'abord. Une colonne fluide, barre d'onglets en bas
   pour le pouce ; sur ordinateur, grille 12 colonnes et navigation en haut.
   ========================================================= */
:root{
  /* Palette de marque (planche d'identité) */
  --espresso:#4A2C1F; --mocha:#8B5A3C; --latte:#D7A77A; --cream:#F7E9DC; --ivory:#FDF9F4;
  /* Usages */
  --bg:var(--ivory);            /* fond de l'app */
  --surface:#FFFFFF;            /* cartes */
  --soft:var(--cream);          /* fonds doux, chiffres, encadrés */
  --title:var(--espresso);      /* titres */
  --text:#33241B;               /* texte courant */
  --muted:#7D6A5D;              /* métadonnées */
  --line:#EFE2D4;               /* filets */
  --accent:var(--mocha);        /* liens, actions, états actifs */
  --accent-strong:var(--espresso);
  --on-accent:#FFFFFF;
  --highlight:var(--latte);     /* étincelle, soulignés, focus */
  --warn:#9A5A16; --warn-soft:#FBEBD6;
  /* Teintes de rubriques : sourdes, pour casser la monotonie brune sans la contredire */
  --c-afrique:#B4643C; --c-capital:#4E6B86; --c-ecoafrique:#7B8B4E; --c-energie:#C08A2E; --c-tech:#3F7A74; --c-monde:#7A5068;
  /* Typo */
  --font-head:"Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  /* Échelle */
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:18px; --t-xl:22px; --t-2xl:28px; --t-3xl:34px;
  /* Espacements (base 4) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  /* Rayons, ombres */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --shadow:0 1px 2px rgba(74,44,31,.06), 0 8px 24px -12px rgba(74,44,31,.18);
  --shadow-lift:0 2px 4px rgba(74,44,31,.06), 0 16px 32px -14px rgba(74,44,31,.28);
  --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17100C; --surface:#21170F; --soft:#2C1F16; --title:#F7E9DC; --text:#EADCCD; --muted:#B19C8A; --line:#3A2B20;
    --accent:#D7A77A; --accent-strong:#F7E9DC; --on-accent:#2A1810; --warn:#F0B878; --warn-soft:#3A2A1A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-lift:var(--shadow);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17100C; --surface:#21170F; --soft:#2C1F16; --title:#F7E9DC; --text:#EADCCD; --muted:#B19C8A; --line:#3A2B20;
  --accent:#D7A77A; --accent-strong:#F7E9DC; --on-accent:#2A1810; --warn:#F0B878; --warn-soft:#3A2A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-lift:var(--shadow);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:var(--t-md); line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom))}
@media (min-width:900px){ body{padding-bottom:0} }
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
img{max-width:100%; display:block}
:focus-visible{outline:2px solid var(--highlight); outline-offset:2px; border-radius:6px}
h1,h2,h3{font-family:var(--font-head); color:var(--title); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.01em}
.wrap{max-width:1160px; margin:0 auto; padding:0 max(var(--s4), env(safe-area-inset-left)) 0 max(var(--s4), env(safe-area-inset-right))}
@media (min-width:640px){ .wrap{padding:0 var(--s6)} }
.ico{width:22px; height:22px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---------- En-tête ---------- */
.appbar{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); padding-top:env(safe-area-inset-top)}
.appbar .wrap{display:flex; align-items:center; gap:var(--s3); height:60px}
.logo{display:flex; align-items:center; gap:10px}
.logo img{width:38px; height:auto}
.logo b{font-family:var(--font-head); font-weight:600; font-size:27px; letter-spacing:-.02em; color:var(--title); line-height:1}
.logo small{display:none; font-size:10px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-left:6px; padding-top:4px}
@media (min-width:900px){ .logo small{display:block} }
.topnav{margin-left:auto; display:none; gap:4px}
@media (min-width:900px){ .topnav{display:flex} }
.topnav a{display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:var(--r-pill); font-weight:600; font-size:var(--t-sm); color:var(--muted)}
.topnav a:hover{color:var(--title); background:var(--soft)}
.topnav a[aria-current="page"]{color:var(--title); background:var(--soft)}
.topnav .ico{width:19px; height:19px}
.cnt{display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:700; font-variant-numeric:tabular-nums}
.appbar-date{margin-left:auto; font-size:var(--t-xs); font-weight:600; color:var(--muted); text-transform:capitalize}
@media (min-width:900px){ .appbar-date{display:none} }

/* ---------- Barre d'onglets (mobile) ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{display:grid; grid-template-columns:repeat(4,1fr); height:var(--tabbar-h); max-width:560px; margin:0 auto}
.tabbar a{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:600; color:var(--muted); position:relative}
.tabbar a[aria-current="page"]{color:var(--accent-strong)}
.tabbar a[aria-current="page"] .ico{stroke-width:2.2}
.tabbar a[aria-current="page"]::before{content:""; position:absolute; top:0; width:28px; height:3px; border-radius:0 0 3px 3px; background:var(--highlight)}
.tabbar .cnt{position:absolute; top:8px; left:calc(50% + 6px); min-width:16px; height:16px; font-size:10px}
@media (min-width:900px){ .tabbar{display:none} }

/* ---------- Rubriques ---------- */
.cats{display:flex; gap:var(--s2); overflow-x:auto; padding:var(--s2) 0 var(--s3); scrollbar-width:none; scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none; display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:var(--r-pill); background:var(--surface); border:1px solid var(--line); font-size:var(--t-sm); font-weight:600; color:var(--text); scroll-snap-align:start; transition:background .15s, border-color .15s}
.chip:hover{border-color:var(--latte)}
.chip i{width:8px; height:8px; border-radius:50%; background:var(--dot, var(--latte))}
.chip .n{color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums}
.chip[aria-current="page"]{background:var(--espresso); border-color:var(--espresso); color:var(--ivory)}
.chip[aria-current="page"] .n{color:var(--latte)}
:root[data-theme="dark"] .chip[aria-current="page"]{background:var(--cream); color:#2A1810; border-color:var(--cream)}

/* ---------- Typo & métadonnées ---------- */
.eyebrow{display:inline-flex; align-items:center; gap:7px; font-size:var(--t-xs); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--cat, var(--accent))}
.eyebrow i{width:7px; height:7px; border-radius:50%; background:var(--cat, var(--accent))}
.meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-size:13px; color:var(--muted)}
.meta span + span::before{content:""; display:inline-block; width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.5; margin-right:10px; vertical-align:middle}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.03em; padding:3px 9px; border-radius:var(--r-pill); background:var(--soft); color:var(--muted)}
.tag.warn{background:var(--warn-soft); color:var(--warn)}
.tag.auto{background:var(--warn-soft); color:var(--warn)}
.tag .ico{width:13px; height:13px; stroke-width:2.2}

/* ---------- Visuels ---------- */
.media{position:relative; overflow:hidden; background:var(--soft); border-radius:var(--r-md)}
.media img{width:100%; height:100%; object-fit:cover}
.media .badge-ill{position:absolute; left:10px; top:10px; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border-radius:var(--r-pill); background:rgba(253,249,244,.82); color:#4A2C1F; backdrop-filter:blur(6px)}
.media .big{position:absolute; left:16px; bottom:12px; right:16px; font-family:var(--font-head); font-weight:600; color:#FFFDF9; letter-spacing:-.02em; line-height:1; text-shadow:0 2px 16px rgba(40,20,10,.25)}

/* ---------- Une ---------- */
.hello{padding:var(--s4) 0 var(--s2)}
.hello .d{font-size:var(--t-sm); font-weight:600; color:var(--muted); text-transform:capitalize}
.hello h1{font-size:var(--t-3xl); line-height:1.08; margin-top:2px}
.hello p{margin:var(--s2) 0 0; color:var(--muted); max-width:56ch}
@media (min-width:900px){ .hello{padding:var(--s8) 0 var(--s4)} .hello h1{font-size:44px} }

.lead{display:grid; gap:var(--s6); margin:var(--s4) 0 var(--s8)}
@media (min-width:900px){ .lead{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:var(--s8)} }
.hero{display:block; border-radius:var(--r-lg); overflow:hidden; background:var(--surface); box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s}
.hero:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.hero .media{border-radius:0; aspect-ratio:4/3.5}
@media (min-width:640px){ .hero .media{aspect-ratio:16/9.5} }
.hero .media::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(30,15,8,0) 28%, rgba(30,15,8,.55) 62%, rgba(30,15,8,.82) 100%)}
.hero .over h2{text-shadow:0 1px 12px rgba(20,10,5,.35)}
.hero .over{position:absolute; z-index:2; left:var(--s5); right:var(--s5); bottom:var(--s5); display:grid; gap:var(--s2)}
.hero .over .eyebrow{color:var(--latte)} .hero .over .eyebrow i{background:var(--latte)}
.hero .over h2{color:#FFFDF9; font-size:23px; line-height:1.16}
@media (min-width:640px){ .hero .over h2{font-size:34px} }
.hero .body{padding:var(--s4) var(--s5) var(--s5); display:grid; gap:var(--s3)}
.hero .body p{margin:0; font-size:var(--t-lg); line-height:1.5; color:var(--text)}
.hero .media .big{display:none}

.stack{display:grid; gap:0; align-content:start}
.stack .head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--s2)}
.row{display:grid; grid-template-columns:1fr 92px; gap:var(--s4); align-items:start; padding:var(--s4) 0; border-top:1px solid var(--line)}
.row:first-of-type{border-top:0; padding-top:var(--s2)}
.row h3{font-size:var(--t-lg); line-height:1.25; margin:6px 0 8px}
.row .media{aspect-ratio:1; border-radius:var(--r-sm)}
.row .media .big{font-size:19px; left:9px; bottom:8px}
.row:hover h3{color:var(--accent)}

.sec{margin:var(--s10) 0 0}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); margin-bottom:var(--s4)}
.sec-head h2{font-size:var(--t-xl)}
.sec-head h2 .eyebrow{display:block; margin-bottom:4px}
.sec-head a{font-size:var(--t-sm); font-weight:600; color:var(--accent); white-space:nowrap}
.sec-head a:hover{text-decoration:underline; text-underline-offset:3px}

/* carrousel « L'essentiel » */
.rail{display:grid; grid-auto-flow:column; grid-auto-columns:78%; gap:var(--s4); overflow-x:auto; scroll-snap-type:x mandatory; padding:2px var(--s4) var(--s4); margin:0 calc(-1 * var(--s4)); scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail > *{scroll-snap-align:start}
@media (min-width:640px){ .rail{grid-auto-columns:42%; margin:0 calc(-1 * var(--s6)); padding:2px var(--s6) var(--s4)} }
@media (min-width:900px){ .rail{grid-auto-flow:row; grid-template-columns:repeat(4,1fr); overflow:visible; margin:0; padding:0} }

.card{display:grid; gap:var(--s3); align-content:start; background:var(--surface); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s}
.card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.card .media{border-radius:0; aspect-ratio:16/10}
.card .media .big{font-size:26px}
.card .c-body{padding:0 var(--s4) var(--s4); display:grid; gap:var(--s2)}
.card h3{font-size:var(--t-lg); line-height:1.25}
.card p{margin:0; font-size:15px; color:var(--muted); line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}

/* carte « analyse » : variation sombre */
.card.dark{background:var(--espresso); color:var(--cream)}
.card.dark h3{color:var(--ivory)} .card.dark p{color:#E2CBB6} .card.dark .meta{color:#CDB39C}
.card.dark .eyebrow{color:var(--latte)} .card.dark .eyebrow i{background:var(--latte)}

/* chiffre à retenir */
.figure-card{display:grid; gap:var(--s2); padding:var(--s6) var(--s5); border-radius:var(--r-lg); background:var(--soft); position:relative; overflow:hidden}
.figure-card .lbl{font-size:var(--t-xs); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
.figure-card b{font-family:var(--font-head); font-weight:600; font-size:64px; line-height:1; color:var(--espresso); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .figure-card b{color:var(--latte)}
.figure-card p{margin:0; font-size:var(--t-lg); max-width:42ch; color:var(--text)}
.figure-card a{font-weight:600; color:var(--accent); font-size:var(--t-sm)}
.figure-card img.spark{position:absolute; right:-18px; top:-10px; width:150px; opacity:.16; pointer-events:none}
@media (min-width:900px){ .figure-card{grid-template-columns:auto 1fr; align-items:center; column-gap:var(--s8); padding:var(--s8)} .figure-card .lbl{grid-column:1/-1} .figure-card b{font-size:88px} }

/* sections de rubrique : une grande + des lignes */
.mix{display:grid; gap:var(--s5)}
@media (min-width:900px){ .mix{grid-template-columns:1.25fr 1fr; gap:var(--s8)} }
.mix .stack .row:first-child{padding-top:0; border-top:0}

.empty{padding:var(--s10) 0; color:var(--muted); font-size:var(--t-lg); max-width:52ch}
.empty h2{font-size:var(--t-2xl); margin-bottom:var(--s2)}
.notice{display:flex; gap:var(--s3); align-items:flex-start; background:var(--warn-soft); color:var(--text); border-radius:var(--r-md); padding:var(--s3) var(--s4); margin:var(--s3) 0; font-size:15px}

/* ---------- Article ---------- */
.reader{max-width:720px; margin:0 auto; padding-bottom:var(--s12)}
.reader-bar{position:sticky; top:calc(60px + env(safe-area-inset-top)); z-index:20; display:flex; align-items:center; gap:var(--s2); padding:var(--s2) 0; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
.icon-btn{display:inline-grid; place-items:center; width:42px; height:42px; border-radius:50%; background:var(--surface); border:1px solid var(--line); color:var(--title); transition:background .15s, border-color .15s}
.icon-btn:hover{border-color:var(--latte)}
.icon-btn[aria-pressed="true"]{background:var(--espresso); border-color:var(--espresso); color:var(--ivory)}
.icon-btn[aria-pressed="true"] .ico{fill:currentColor}
.reader-bar .grow{flex:1; min-width:0; font-size:var(--t-sm); font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.r-hero{margin:var(--s2) calc(-1 * var(--s4)) 0}
.r-hero .media{border-radius:0; aspect-ratio:16/10}
@media (min-width:640px){ .r-hero{margin:var(--s2) 0 0} .r-hero .media{border-radius:var(--r-lg)} }
.caption{display:flex; justify-content:space-between; gap:var(--s3); font-size:12px; color:var(--muted); padding:var(--s2) var(--s4) 0}
@media (min-width:640px){ .caption{padding:var(--s2) 0 0} }
.caption button, .caption a{color:var(--accent); font-weight:600}
.r-head{display:grid; gap:var(--s3); margin:var(--s6) 0 var(--s5)}
.r-head h1{font-size:30px; line-height:1.12}
@media (min-width:640px){ .r-head h1{font-size:40px} }
.r-head .dek{margin:0; font-size:19px; line-height:1.5; color:var(--muted)}
.r-meta{display:flex; flex-wrap:wrap; gap:var(--s2) var(--s4); align-items:center; padding:var(--s3) 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
.r-meta b{color:var(--text); font-weight:600}
.srcdots{display:flex}
.srcdots span{display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--soft); color:var(--espresso); font-size:11px; font-weight:700; border:2px solid var(--bg); margin-left:-8px}
.srcdots span:first-child{margin-left:0}
:root[data-theme="dark"] .srcdots span{color:var(--latte)}

.lede{font-size:20px; line-height:1.55; color:var(--title); font-weight:500; margin:var(--s6) 0}
.figs{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(150px, 46%); gap:var(--s3); overflow-x:auto; scroll-snap-type:x mandatory; margin:0 calc(-1 * var(--s4)) var(--s8); padding:0 var(--s4) 4px; scrollbar-width:none}
.figs::-webkit-scrollbar{display:none}
@media (min-width:640px){ .figs{grid-auto-flow:row; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); margin:0 0 var(--s8); padding:0; overflow:visible} }
.figs > div{scroll-snap-align:start; background:var(--soft); border-radius:var(--r-md); padding:var(--s4); display:grid; gap:4px; align-content:start}
.figs b{font-family:var(--font-head); font-weight:600; font-size:28px; line-height:1.05; color:var(--espresso); letter-spacing:-.02em; font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .figs b{color:var(--latte)}
.figs span{font-size:14px; font-weight:600; color:var(--text); line-height:1.3}
.figs small{font-size:12.5px; color:var(--muted); line-height:1.35}
.prose{font-size:18px; line-height:1.7}
.prose p{margin:0 0 1.1em; max-width:64ch}
.prose h2{font-size:var(--t-xl); margin:1.6em 0 .5em}
.blk{margin:var(--s10) 0}
.blk-title{display:flex; align-items:center; gap:8px; font-family:var(--font-head); font-size:var(--t-lg); font-weight:600; color:var(--title); margin-bottom:var(--s3)}
.blk-title .ico{width:20px; height:20px; color:var(--accent)}
.why{background:var(--soft); border-radius:var(--r-lg); padding:var(--s5); position:relative}
.why p{margin:0; font-size:var(--t-lg); line-height:1.6}
.ctx{border-left:3px solid var(--latte); padding:2px 0 2px var(--s4)}
.ctx p{margin:0; font-size:17px; line-height:1.6}
.ctx .note{font-size:12.5px; color:var(--muted); margin-top:6px}
details.q{border-bottom:1px solid var(--line)}
details.q:first-of-type{border-top:1px solid var(--line)}
details.q summary{cursor:pointer; padding:var(--s4) 0; font-weight:600; font-size:var(--t-md); list-style:none; display:flex; justify-content:space-between; align-items:center; gap:var(--s3); color:var(--title)}
details.q summary::-webkit-details-marker{display:none}
details.q summary .ico{width:18px; height:18px; color:var(--accent); transition:transform .2s}
details.q[open] summary .ico{transform:rotate(45deg)}

.unk ul{margin:0; padding:0; list-style:none; display:grid; gap:var(--s2)}

.timeline{list-style:none; margin:0; padding:0; display:grid; gap:0}
.timeline li{display:grid; grid-template-columns:14px 1fr; gap:var(--s3); padding-bottom:var(--s4); position:relative}
.timeline li::before{content:""; width:12px; height:12px; border-radius:50%; background:var(--bg); border:3px solid var(--accent); margin-top:4px; z-index:1}
.timeline li:not(:last-child)::after{content:""; position:absolute; left:6px; top:16px; bottom:0; width:2px; background:var(--line)}

.timeline p{margin:2px 0 0; font-size:16px}
.timeline small{color:var(--muted)}
.items .it{display:grid; grid-template-columns:1fr auto; gap:2px var(--s4); padding:var(--s4) 0; border-top:1px solid var(--line)}
.items .it:last-child{border-bottom:1px solid var(--line)}
.items .it b{font-family:var(--font-head); font-weight:600; color:var(--title)}
.items .it .w{color:var(--muted); font-weight:400; font-size:14px}
.items .it .am{font-family:var(--font-head); font-weight:600; font-size:var(--t-lg); color:var(--accent); text-align:right; font-variant-numeric:tabular-nums}

.sources{display:grid; gap:var(--s2)}
.src{display:grid; grid-template-columns:36px 1fr; gap:var(--s3); align-items:center; padding:var(--s3); border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line)}

.lnk{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--accent); padding:6px 11px; border-radius:var(--r-pill); background:var(--soft)}

.note-line{font-size:13px; color:var(--muted)}

.foot{margin-top:var(--s12); padding:var(--s6) 0 var(--s8); border-top:1px solid var(--line); color:var(--muted); font-size:13px; line-height:1.6; display:grid; gap:var(--s3)}

.skeleton{border-radius:var(--r-md); background:linear-gradient(90deg, var(--soft), var(--surface), var(--soft)); background-size:200% 100%}
@media (prefers-reduced-motion: no-preference){
  .skeleton{animation:sh 1.4s linear infinite} @keyframes sh{to{background-position:-200% 0}}
  ::view-transition-old(root){animation:vt-out .16s ease both}
  ::view-transition-new(root){animation:vt-in .22s ease both}
  @keyframes vt-out{to{opacity:0; transform:translateY(-6px)}}
  @keyframes vt-in{from{opacity:0; transform:translateY(8px)}}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (iso, opts={day:"numeric", month:"long", year:"numeric"}) => {
  if(!iso) return ""; const d = new Date(iso.length===10 ? iso+"T12:00:00Z" : iso);
  return isNaN(d) ? esc(iso) : d.toLocaleDateString("fr-FR", opts);
};

/* ---------- Illustrations Moka : paysage au lever du jour, teinté par rubrique ---------- */
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const coverCache = new Map();
function mixc(a,b,k){ return a.map((v,i)=>Math.round(v+(b[i]-v)*k)); }
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function coverURL(a, w=960, h=640){
  const key=a.id+":"+w+":"+h; if(coverCache.has(key)) return coverCache.get(key);
  const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d");
  const r=rng(hash(a.id)); const tint=(CAT[a.category]||CATS[0]).tint;
  const IV=[253,249,244], CR=[247,233,220], LA=[215,167,122], MO=[139,90,60], ES=[74,44,31];
  const style=hash(a.id+"s")%3;
  // ciel
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0, rgb(mixc(CR,tint,.30))); sky.addColorStop(.7, rgb(mixc(IV,LA,.22))); sky.addColorStop(1, rgb(mixc(LA,tint,.30)));
  g.fillStyle=sky; g.fillRect(0,0,w,h);
  // soleil
  const sx=w*(.25+r()*.5), sy=h*(.42+r()*.12), sr=h*(.16+r()*.08);
  const sun=g.createRadialGradient(sx,sy,0,sx,sy,sr*2.6); sun.addColorStop(0,"rgba(255,226,180,.9)"); sun.addColorStop(.35,"rgba(240,190,130,.55)"); sun.addColorStop(1,"rgba(240,190,130,0)");
  g.fillStyle=sun; g.fillRect(0,0,w,h);
  g.beginPath(); g.arc(sx,sy,sr,0,Math.PI*2); g.fillStyle="rgba(250,212,160,.95)"; g.fill();
  if(style===1){ // rayons, comme l'étincelle du logo
    g.strokeStyle="rgba(200,130,80,.55)"; g.lineCap="round"; g.lineWidth=h*.022;
    for(let i=0;i<3;i++){ const ang=-Math.PI*(.62-i*.17); const r1=sr*1.35, r2=sr*1.85; g.beginPath(); g.moveTo(sx+Math.cos(ang)*r1, sy+Math.sin(ang)*r1); g.lineTo(sx+Math.cos(ang)*r2, sy+Math.sin(ang)*r2); g.stroke(); }
  }
  // collines superposées, comme les pages du logo
  const layers=4+(style===2?1:0);
  for(let i=0;i<layers;i++){
    const k=i/(layers-1); const base=h*(.55+k*.32); const amp=h*(.06+r()*.07);
    const col = i===layers-1 ? mixc(ES,tint,.42) : mixc(mixc(LA,MO,k), tint, .46+.16*k);
    g.beginPath(); g.moveTo(0,h); g.lineTo(0,base);
    const ph=r()*Math.PI*2, fr=1+r()*1.4;
    for(let x=0;x<=w;x+=8){ g.lineTo(x, base - Math.sin(x/w*Math.PI*fr+ph)*amp - Math.sin(x/w*Math.PI*3.1+ph*2)*amp*.25); }
    g.lineTo(w,h); g.closePath(); g.fillStyle=rgb(col); g.fill();
  }
  // grain léger
  const img=g.getImageData(0,0,w,h), d=img.data; for(let i=0;i<d.length;i+=4){ const n=(r()-.5)*10; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(img,0,0);
  const url=c.toDataURL("image/jpeg",.84); coverCache.set(key,url); return url;
}
function photoSrc(a){ const im=a.image; if(!im) return null; if(im.asset) return "/_blob/"+im.asset; if(im.src) return im.src; return null; }
function mediaHTML(a, {w=960,h=640, big=true, badge=true}={}){
  const p=photoSrc(a);
  if(p) return `<div class="media"><img src="${esc(p)}" alt="${esc(a.image.alt||"")}" loading="lazy" decoding="async" onerror="this.closest('.media').classList.add('broken');this.remove()">${badge&&a.image.kind==="contexte"?`<span class="badge-ill">Photo d'illustration</span>`:""}</div>`;
  const cv=a.cover||{};
  return `<div class="media"><img src="${coverURL(a,w,h)}" alt="" loading="lazy">${badge?`<span class="badge-ill">Illustration</span>`:""}${big&&cv.big?`<span class="big">${esc(cv.big)}</span>`:""}</div>`;
}

/* ---------- Helpers éditoriaux ---------- */
const byScore = (a,b)=> (b.score||0)-(a.score||0) || String(b.published_date).localeCompare(String(a.published_date));
const srcNames = a => [...new Set((a.sources||[]).map(s=>s.name))];
function readMin(a){ const t=[a.brief, ...(a.body||[]).map(b=>b.p), a.why, ...(a.items||[]).map(i=>i.what)].join(" "); return Math.max(1, Math.round(t.split(/\s+/).length/210)); }
function eyebrow(a){ const c=CAT[a.category]; return `<span class="eyebrow" style="${catStyle(a)}"><i></i>${esc(c?c.short:a.category)}${a.kind==="analyse"?" · Analyse":a.kind==="brief"?" · En bref":""}</span>`; }
function flags(a){
  const v=VERIF[a.origin==="auto"?"auto":a.verification];
  return `${v&&v.cls?`<span class="tag ${v.cls}">${esc(v.t)}</span>`:""}`;
}
function metaHTML(a, short=false){
  const n=srcNames(a);

}
function rowCard(a){

}
function card(a){
  const dark = a.kind==="analyse";
  return `<a class="card${dark?" dark":""}" href="#a-${esc(a.id)}">${mediaHTML(a,{w:800,h:500})}<div class="c-body">${eyebrow(a)}<h3>${esc(a.title)}</h3><p>${esc(a.dek)}</p>${flags(a)}${metaHTML(a)}</div></a>`;
}
function footer(){
  const m=S.meta; const auto = m && m.last_run ? `Dernière relève automatique : ${fmtDate(m.last_run,{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}.` : `Édition rédigée par Claude le 7 novembre 2026 à partir de vos newsletters ; la relève automatique n'a pas encore été lancée.`;
  return `<footer class="foot"><div class="logo"><img src="${SYMBOL_URL}" alt=""><b>Moka</b></div><p>Moka sélectionne et explique ; il ne remplace pas les sources. Chaque chiffre renvoie à une newsletter de votre libellé Moka/Newsletters.</p><p>${auto} Les visuels marqués « Illustration » sont générés par Moka et ne montrent pas les entreprises ni les événements cités.</p></footer>`;
}

/* ---------- Navigation ---------- */
function setNav(tab){

function catsBar(active){

}
function statusNotice(){
  if(S.loadErr) return `<div class="notice">${esc(S.loadErr)}</div>`;

function viewHome(){

  const arts=[...S.articles].sort(byScore);

    <a class="hero" href="#a-${esc(hero.id)}"><div style="position:relative">${mediaHTML(hero,{w:1200,h:760})}<div class="over">${eyebrow(hero)}<h2>${esc(hero.title)}</h2></div></div>
      <div class="body"><p>${esc(hero.dek)}</p>${flags(hero)}${metaHTML(hero)}</div></a>
    <div class="stack"><div class="head"><span class="eyebrow">À suivre aussi</span></div>${side.map(rowCard).join("")}</div>
  </section>`;
  if(rail.length) html += `<section class="sec"><div class="sec-head"><h2>L'essentiel</h2></div><div class="rail">${rail.map(card).join("")}</div></section>`;
  const pick = arts.find(a=>a.kind==="analyse" && a.figures?.length) || hero;
  const f = pick.figures?.[pick.figures.length>3?3:0];
  if(f) html += `<section class="sec"><div class="figure-card"><img class="spark" src="${SYMBOL_URL}" alt=""><span class="lbl">Le chiffre à retenir</span><b>${esc(f.v)}</b><div><p>${esc(f.l)}${f.n?`, ${esc(f.n)}`:""}.</p><a href="#a-${esc(pick.id)}">${esc(pick.title)} →</a></div></div></section>`;
  for(const c of CATS){

}

    (list.length?`<div class="stack" style="max-width:760px">${list.map(rowCard).join("")}</div>`:`<div class="empty"><h2>Rien de sauvegardé</h2>Dans un article, touchez l'icône marque-page pour le retrouver ici.</div>`)+footer();

function chartHTML(ch){
  const two = ch.a_label!=null; const rows=ch.rows||[]; const fmt=v=>String(v).replace(".",",");
  const gmax = two?null:Math.max(...rows.map(r=>r.b));
  return `<div class="chart">${two?`<div class="legend"><span><i style="background:var(--cream);border:1px solid var(--latte)"></i>${esc(ch.a_label)}</span><span><i style="background:var(--mocha)"></i>${esc(ch.b_label)}</span></div>`:""}
  ${rows.map(r=>{ const mx=two?Math.max(r.a,r.b):gmax; return `<div class="row2"><div class="l">${esc(r.label)}</div><div class="bars">${two?`<div class="bar a" style="width:${(r.a/mx*100).toFixed(1)}%">${fmt(r.a)}</div>`:""}<div class="bar b" style="width:${(r.b/mx*100).toFixed(1)}%">${fmt(r.b)}</div></div></div>`;}).join("")}
  ${ch.note?`<div class="note">${esc(ch.note)}</div>`:""}</div>`;
}
const initials = n => n.replace(/^Africa:\s*/,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const FORMATS = [{id:"express", name:"Express"}, {id:"comprendre", name:"Comprendre"}, {id:"approfondir", name:"Approfondir"}];
const words = arr => arr.filter(Boolean).join(" ").split(/\s+/).filter(Boolean).length;
function fmtMinutes(a, f){
  const base=[a.brief, ...(a.body||[]).map(b=>b.p), a.why, ...(a.items||[]).map(i=>i.what), ...(a.explain||[]).map(e=>e.a), a.moka_context];
  if(f==="express") return 1;
  if(f==="approfondir"){ const d=a.formats?.approfondir; if(!d||d.status==="indisponible") return null;
    return Math.max(2, Math.round(words([...base, ...d.sections.flatMap(s=>s.p)])/200)); }
  return Math.max(1, Math.round(words(base)/200));
}
function figsHTML(list){ return list.length?`<div class="figs" aria-label="Chiffres clés">${list.map(f=>`<div><b>${esc(f.v)}</b><span>${esc(f.l)}</span>${f.n?`<small>${esc(f.n)}</small>`:""}</div>`).join("")}</div>`:""; }
function sourcesHTML(a, extra){
  return `<section class="blk"><div class="blk-title">${I.mail}Sources</div><div class="sources">${(a.sources||[]).map(s=>`<div class="src"><span class="mono">${esc(initials(s.name))}</span><div><b>${esc(s.name)}</b>${s.via?` <span class="sub">via ${esc(s.via)}</span>`:""}<div class="sub">Reçue le ${fmtDate(s.date)}</div></div><div class="links">${s.web?`<a class="lnk" href="${esc(s.web)}" target="_blank" rel="noopener">${esc(s.web_label||"Article original")}${I.ext}</a>`:""}${s.gmail?`<a class="lnk" href="${esc(s.gmail)}" target="_blank" rel="noopener">Dans Gmail${I.ext}</a>`:""}</div></div>`).join("")}</div>
  ${extra&&extra.length?`<div class="blk-sub">Sources de l'analyse approfondie</div><ol class="deep-src">${extra.map((s,i)=>`<li id="ds-${esc(s.id)}"><span class="n">${i+1}</span><div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}${I.ext}</a>${s.date?`<small>${esc(fmtDate(s.date.length>=10?s.date:s.date+"-01",{month:"long",year:"numeric",...(s.date.length>=10?{day:"numeric"}:{})}))}</small>`:""}</div></li>`).join("")}</ol>`:""}</section>`;
}
function relatedHTML(a){ const rel=(a.related||[]).map(r=>S.articles.find(x=>x.id===r)).filter(Boolean);
  return rel.length?`<section class="blk"><div class="blk-title">À lire ensuite</div><div class="rail">${rel.map(card).join("")}</div></section>`:""; }
function comprendreParts(a){

const unkHTML = list => list.length?`<section class="blk unk"><div class="blk-title">${I.help}Ce qu'on ne sait pas encore</div><ul>${list.map(u=>`<li><span>${esc(u)}</span></li>`).join("")}</ul></section>`:"";
function bodyExpress(a){

function bodyApprofondir(a){

  }

  const deep=`<section class="deep"><div class="deep-head">${I.spark}<span>Analyse approfondie</span></div>

  if(!db){ S.loaded=true; S.loadErr="Moka ne peut pas joindre sa base dans cet affichage. Ouvrez-le depuis claude.ai, connecté à votre compte."; route(); return; }
  const timer=setTimeout(()=>{ if(!S.loaded){ S.loaded=true; S.stale=true; S.loadErr="Les actualités mettent du temps à arriver. Vérifiez votre connexion ; la page se mettra à jour toute seule."; route(); } },10000);
  db.collection("articles").onSnapshot(snap=>{

      if(S.loaded){ if(location.hash.startsWith("#a-")){ setNav(""); const a=S.articles.find(x=>"#a-"+x.id===location.hash); if(a) renderFormat(a); } else rerender(); }

const MCP_FIX = {

/* Testé le 7 nov. 2026 sur un vrai numéro de The Daily Pitch : 192 Ko de HTML → 13 Ko de texte propre. */
function htmlToText(html){
  const doc=new DOMParser().parseFromString(String(html||""),"text/html");
  doc.querySelectorAll("script,style,head,title,img,svg,picture,video,noscript").forEach(n=>n.remove());
  doc.querySelectorAll('[style*="display:none"],[style*="display: none"],[style*="max-height:0"],[style*="mso-hide:all"]').forEach(n=>n.remove());
  doc.querySelectorAll("a").forEach(a=>{ const t=a.textContent.trim(); if(!t) a.remove(); });
  doc.querySelectorAll("br").forEach(n=>n.replaceWith("\n"));
  doc.querySelectorAll("p,div,tr,li,h1,h2,h3,h4,h5,table,section,article,blockquote").forEach(n=>{ n.prepend("\n"); n.append("\n"); });
  return (doc.body?doc.body.textContent:"").replace(/[ \t ͏​‌ ­]+/g," ").replace(/ *\n */g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function cleanBody(t){
  return String(t||"").replace(/https?:\/\/\S+/g,"").replace(/\[\s*\]/g,"").replace(/\(\s*\)/g,"").replace(/[ \t͏ ]+/g," ").replace(/\n{3,}/g,"\n\n").trim().slice(0,24000);
}
async function runIngest(){
  if(INGEST_PAUSED||S.ingest.running) return;
  S.ingest={running:true, log:[]}; viewSources();
  const use=(n)=> (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [mcp,sample]=await Promise.all([use("mcp"),use("sample")]);
  const done=(report)=>{ S.ingest.running=false; log(report); viewSources(); };
  if(!mcp){ return done("Le connecteur Gmail n'est pas disponible dans cet affichage. Ouvrez Moka dans claude.ai."); }
  if(!sample){ return done("La rédaction par Claude n'est pas disponible dans cet affichage."); }
  if(!S.db || !S.isOwner){ return done("Seul le propriétaire de Moka peut ajouter des actualités."); }
  const metaRef=S.db.doc("meta/ingest"); let meta={threads:{}};
  try{ const d=await metaRef.get(); if(d.exists) meta={threads:{}, ...d.data()}; }catch(e){}
  let threads=[];
  try{
    log("Recherche des newsletters des 3 derniers jours…");
    const r=await mcp.callTool("Gmail","search_threads",{query:"label:moka-newsletters newer_than:3d", pageSize:25, view:"THREAD_VIEW_SUMMARY"});
    const p=r.payload||{}; threads=(p.threads||[]).filter(t=>!meta.threads[t.id]);
    log(`${(p.threads||[]).length} fils trouvés, ${threads.length} nouveaux.`);
  }catch(e){ return done(MCP_FIX[e.code] || `Recherche Gmail impossible (${e.code||"erreur"}) : ${e.message||""}`); }
  threads=threads.slice(0,6);
  let created=0, merged=0, skipped=0;
  for(const t of threads){
    const m0=(t.messages||[])[0]||{}; const sender=(m0.addressDisplayNames||[])[0]?.displayName || m0.sender || "Newsletter";
    log(`\n· ${sender} — ${m0.subject||""}`);
    let msg;
    try{ const r=await mcp.callTool("Gmail","get_thread",{threadId:t.id, messageFormat:"PLAIN_TEXT"}); msg=((r.payload||{}).messages||[])[0]; }
    catch(e){ log(`  lecture impossible (${e.code}).`); if(MCP_FIX[e.code] && e.code!=="tool_error") return done(MCP_FIX[e.code]); continue; }
    let body=cleanBody(msg?.plaintextBody);
    const markDone=(why)=>{ meta.threads[t.id]={at:new Date().toISOString(), why}; };
    if(body.length<600){
      // Newsletters HTML (ex. PitchBook) : la version texte ne contient qu'un lien « voir dans le navigateur ».
      try{ const r2=await mcp.callTool("Gmail","get_thread",{threadId:t.id, messageFormat:"FULL_CONTENT"}); const m2=((r2.payload||{}).messages||[])[0];
           if(m2?.htmlBody){ body=cleanBody(htmlToText(m2.htmlBody)); log(`  version HTML convertie en texte (${Math.round(body.length/1000)} k caractères).`); } }
      catch(e){ log(`  lecture HTML impossible (${e.code}).`); }
    }
    if(body.length<600){ log("  pas de texte exploitable, ignorée."); markDone("no-text"); skipped++; continue; }
    const index=S.articles.map(a=>({id:a.id, title:a.title, date:a.event_date||a.published_date, entities:(a.entities||[]).slice(0,8)}));
    const prompt=`Tu es le rédacteur de Moka, une application d'actualité en français pour un lecteur qui suit l'investissement et l'économie africaine (priorités : 1 startups africaines/VC/levées/exits/fonds, 2 private equity/M&A/financements, 3 économie et entreprises africaines, 4 énergie/oil & gas/logistique/assurance/industrie, 5 tech mondiale, 6 macro internationale).
À partir de la NEWSLETTER ci-dessous, sélectionne au plus 3 informations qui méritent vraiment l'attention (ignore publicités, sponsors, événements, offres d'emploi). S'il n'y a rien d'important, renvoie une liste vide.
RÈGLES ABSOLUES : n'utilise QUE des faits présents dans la newsletter. N'invente jamais un chiffre, une valorisation, un investisseur, une date. Si une information est présentée comme une rumeur ou "reportedly", indique verification:"non-confirme". Liste dans unknowns ce que la source ne dit pas et qu'un lecteur voudrait savoir.
STYLE : français naturel, vivant, pédagogique, phrases courtes, aucun jargon inutile, pas de formules d'IA ni de tirets cadratins.
DATES : la newsletter a été reçue le ${(m0.date||"").slice(0,10)}. event_date est la date de l'événement lui-même, jamais postérieure à la réception. Si l'information concerne un événement de plus de 30 jours, mets old:true (Moka ne la publiera pas comme une actualité).
REGROUPEMENT : si l'information correspond au même événement qu'un article existant (liste INDEX), mets son id dans merge_into et donne seulement update (une phrase sur ce que cette source ajoute).
Réponds en JSON strict : {"stories":[{"merge_into":null|"id","update":"","title":"","dek":"1 phrase","brief":"2 phrases","category":"afrique-vc|capital|economie-afrique|energie-industrie|tech|monde","kind":"actu|analyse|brief","priority":1-6,"event_label":"ex. 4 novembre 2026","event_date":"AAAA-MM-JJ ou null","figures":[{"v":"","l":"","n":""}],"body":[{"h":null,"p":""}],"why":"","unknowns":[""],"verification":"rapporte|non-confirme|analyse","entities":[""],"cover_big":"chiffre ou mot court","cover_small":"2 mots","express_points":["3 phrases courtes : les faits essentiels"],"express_why":"1 phrase","old":false}]}
INDEX : ${JSON.stringify(index)}
NEWSLETTER (${sender}, reçue le ${m0.date||""}, objet : ${m0.subject||""}) :
${body}`;
    let out;
    try{ out=await sample.json(prompt,{modelTier:"default"}); }
    catch(e){ if(e.code==="not_granted") return done("Vous n'avez pas autorisé Moka à utiliser Claude pour rédiger."); if(e.code==="rate_limited") return done("Trop de demandes à Claude pour l'instant. Réessayez dans quelques minutes."); log(`  rédaction impossible (${e.code||"erreur"}).`); continue; }
    const stories=Array.isArray(out?.stories)?out.stories:[];
    if(!stories.length){ log("  rien d'assez important."); markDone("empty"); continue; }
    const source={name:sender, date:(m0.date||"").slice(0,10), gmail:msg?.viewUrl||t.viewUrl||null};
    for(const st of stories){
      try{
        const target = st.merge_into && S.articles.find(a=>a.id===st.merge_into);
        if(target){
          const ref=S.db.doc("articles/"+target.id); const cur=(await ref.get()).data()||target;
          const sources=[...(cur.sources||[]), source].filter((s,i,arr)=>arr.findIndex(x=>x.gmail===s.gmail&&x.name===s.name)===i);
          const timeline=[...(cur.timeline||[]), {date:source.date, text:String(st.update||"Nouvelle source sur ce sujet."), source:sender}];
          await ref.update({sources, timeline}); merged++; log(`  regroupé avec « ${target.title} »`);
        } else {
          if(!st.title || !st.dek) continue;
          const recv=(m0.date||"").slice(0,10);
          if(st.old===true || (st.event_date && recv && (new Date(recv)-new Date(st.event_date))/864e5 > 30 && st.kind!=="analyse")){ log(`  ancienne information ignorée : ${st.title}`); continue; }
          if(st.event_date && recv && st.event_date>recv) st.event_date=recv;
          const id=slugify(st.title)+"-"+(source.date||"").replace(/-/g,"");
          const cat = CAT[st.category]?st.category:"monde";
          const pr = Math.min(6,Math.max(1,Number(st.priority)||6));
          await S.db.doc("articles/"+id).set({
            title:String(st.title), dek:String(st.dek), brief:String(st.brief||st.dek), category:cat, kind:KIND[st.kind]?st.kind:"actu",
            score: 70-(pr-1)*6, event_label:st.event_label||null, event_date:st.event_date||null, published_date:source.date,
            figures:(st.figures||[]).filter(f=>f&&f.v).slice(0,4), body:(st.body||[]).filter(b=>b&&b.p).slice(0,6), why:st.why||"",
            unknowns:(st.unknowns||[]).filter(Boolean).slice(0,4), verification:st.verification==="non-confirme"?"non-confirme":(st.verification==="analyse"?"analyse":"rapporte"),
            sources:[source], entities:(st.entities||[]).slice(0,12), related:[], explain:[], timeline:[], items:[], chart:null, moka_context:null, disclosure:null, image:null,
            formats:{express:{points:(st.express_points||[]).filter(Boolean).slice(0,3), why:String(st.express_why||st.why||""), figures:[0,1].filter(i=>(st.figures||[])[i]?.v)},
                     approfondir:{status:"indisponible", reason:"Article rédigé automatiquement à partir d'une seule newsletter ; aucune recherche complémentaire n'a encore été faite."}},
            cover:{big:String(st.cover_big||"").slice(0,14), small:String(st.cover_small||"").slice(0,24)},
            origin:"auto", collected_at:new Date().toISOString()
          });
          created++; log(`  + ${st.title}`);
        }
      }catch(e){ if(e.code==="quota_exceeded") return done("La base de Moka est pleine. Il faudra archiver d'anciens articles."); log(`  écriture impossible (${e.code||"erreur"}).`); }
    }
    markDone("ok");
  }
  const ent=Object.entries(meta.threads).sort((a,b)=>String(b[1].at).localeCompare(String(a[1].at))).slice(0,300);
  const report=`${created} nouvelle(s), ${merged} regroupée(s), ${skipped} ignorée(s)`;
  try{ await metaRef.set({threads:Object.fromEntries(ent), last_run:new Date().toISOString(), last_report:report}); }catch(e){}
  done(threads.length?`\nTerminé : ${report}.`:"\nAucune nouvelle newsletter à traiter.");
}

route();
boot();
</script>
