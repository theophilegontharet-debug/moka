name: Essais de voix Moka

# Lancement manuel uniquement (onglet Actions → « Essais de voix Moka » → Run workflow).
# Les clés viennent des secrets du dépôt (Settings → Secrets and variables → Actions) ;
# elles ne sont jamais écrites dans le dépôt ni affichées dans les journaux.
on:
  workflow_dispatch:
    inputs:
      elevenlabs_voice_ids:
        description: "IDs de voix ElevenLabs de votre compte, séparés par des virgules (facultatif)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: audio-essais
  cancel-in-progress: false

jobs:
  essais:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Générer les essais
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_VOICE_IDS: ${{ inputs.elevenlabs_voice_ids }}
          MAX_CHARS: "2000"
        run: python3 tools/audio/essais.py
      - name: Publier les essais
        run: |
          git config user.name "moka-audio[bot]"
          git config user.email "moka-audio@users.noreply.github.com"
          git add site/audio/essais
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -m "Essais de voix"
          git push
