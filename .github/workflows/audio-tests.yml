name: Essais de diction Moka

# Lancement manuel uniquement. Génère les variantes d'un fichier d'essais dans site/audio/<dossier>/.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Fichier d'essais"
        required: false
        default: "audio/tests/passages.json"
      out_dir:
        description: "Dossier de sortie dans site/audio/"
        required: false
        default: "tests"
      title:
        description: "Titre de la page"
        required: false
        default: "Essais de diction · Aoede"
      max_total_chars:
        description: "Plafond de caractères (10 000 maximum)"
        required: false
        default: "3000"

permissions:
  contents: write

# DÉSACTIVÉ (novembre 2026) : Google Chirp est retiré de Moka. Le job ne s'exécute plus.
jobs:
  tests:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le plafond
        env:
          MAX: ${{ inputs.max_total_chars }}
        run: test "$MAX" -le 10000 || { echo "Plafond supérieur à 10 000 refusé"; exit 1; }
      - name: Générer les essais
        env:
          TESTS: ${{ inputs.tests }}
          OUT_DIR: ${{ inputs.out_dir }}
          TITLE: ${{ inputs.title }}
          MAX_TOTAL_CHARS: ${{ inputs.max_total_chars }}
        run: python3 tools/audio/tests.py
      - name: Publier
        run: |
          git config user.name "moka-audio[bot]"
          git config user.email "moka-audio@users.noreply.github.com"
          git add site/audio
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -m "Essais audio"
          git pull --rebase origin main
          git push
