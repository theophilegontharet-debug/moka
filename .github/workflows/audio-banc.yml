name: Banc d'essai audio (Chirp / ElevenLabs)

# Déclenché uniquement sur la branche audio-elevenlabs, quand le fichier de commande change.
# mode "diagnostic" : gratuit. mode "generer" : payant, après accord explicite.
on:
  push:
    branches: [audio-elevenlabs]
    paths: [audio/tests/banc-commande.json]

permissions:
  contents: write

concurrency:
  group: audio-banc
  cancel-in-progress: false

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lire la commande
        id: cmd
        run: |
          MODE=$(python3 -c "import json;print(json.load(open('audio/tests/banc-commande.json'))['mode'])")
          case "$MODE" in diagnostic|generer) ;; *) echo "mode inconnu"; exit 1;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Banc (${{ steps.cmd.outputs.mode }})
        env:
          MODE: ${{ steps.cmd.outputs.mode }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python3 tools/audio/banc.py
      - name: Publier les essais sur la branche
        if: steps.cmd.outputs.mode == 'generer' && always()
        run: |
          git config user.name "moka-audio[bot]"
          git config user.email "moka-audio@users.noreply.github.com"
          git add site/audio/banc
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -m "Banc d'essai audio"
          git push origin HEAD:audio-elevenlabs
